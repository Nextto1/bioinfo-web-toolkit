<!DOCTYPE html>
<html>
<head>
<title>Bioinformatics Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    height: 100vh;
    background: #f4f6f8;
}

.sidebar {
    width: 220px;
    background: #1f2a40;
    color: white;
    padding: 20px;
}

.sidebar button {
    width: 100%;
    margin-bottom: 10px;
    padding: 10px;
    background: #2e3b55;
    color: white;
    border: none;
    cursor: pointer;
}

.sidebar button:hover {
    background: #3d4f73;
}

.main {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

.section {
    display: none;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.active { display: block; }

textarea, input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

button.run {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #007bff;
    color: white;
    border: none;
}

.result {
    background: #eee;
    padding: 10px;
    margin-top: 10px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>🧬 Bio Dashboard</h2>
    <button onclick="show('dna')">DNA → Protein</button>
    <button onclick="show('gc')">GC Content</button>
    <button onclick="show('motif')">Motif</button>
    <button onclick="show('loc')">Localization</button>
    <button onclick="show('blast')">BLAST</button>
    <button onclick="show('uniprot')">UniProt</button>
    <button onclick="show('multi')">Multi</button>
    <button onclick="show('report')">Report</button>
</div>

<div class="main">

<!-- DNA -->
<div id="dna" class="section active">
    <h3>DNA → Protein (Advanced)</h3>

    <textarea id="dnaSeq"></textarea>

    <button class="run" onclick="runTranslate()">Basic Translation</button>
    <button class="run" onclick="runAdvanced()">6-Frame + ORF</button>

    <div id="r1" class="result"></div>
</div>

<!-- GC -->
<div id="gc" class="section">
    <h3>GC Content</h3>
    <textarea id="gcSeq"></textarea>
    <button class="run" onclick="runTool('/gc','gcSeq','r2')">Run</button>
    <div id="r2" class="result"></div>
</div>

<!-- MOTIF -->
<div id="motif" class="section">
    <h3>Motif Search</h3>
    <textarea id="motifSeq"></textarea>
    <input id="motifText" placeholder="Motif">
    <button class="run" onclick="motifRun()">Run</button>
    <div id="r3" class="result"></div>
</div>

<!-- LOCALIZATION -->
<div id="loc" class="section">
    <h3>Subcellular Localization</h3>
    <textarea id="protSeq"></textarea>
    <button class="run" onclick="runLocalization()">Run</button>
    <div id="r4" class="result"></div>
</div>

<!-- BLAST -->
<div id="blast" class="section">
    <h3>BLAST Parser</h3>
    <input type="file" id="blastFile">
    <button class="run" onclick="blastRun()">Parse</button>
    <div id="blastOut" class="result"></div>
</div>

<!-- UNIPROT -->
<div id="uniprot" class="section">
    <h3>UniProt Lookup</h3>
    <input id="upid" placeholder="e.g. P69905">
    <button class="run" onclick="uniprotRun()">Search</button>
    <div id="uniOut" class="result"></div>
</div>

<!-- MULTI -->
<div id="multi" class="section">
    <h3>Multi Sequence</h3>
    <input type="file" id="multiFile">
    <button class="run" onclick="runMulti()">Run</button>
    <div id="multiOut" class="result"></div>

    <canvas id="gcChart"></canvas>
    <canvas id="lenChart"></canvas>
</div>

<!-- REPORT -->
<div id="report" class="section">
    <h3>Report</h3>
    <button class="run" onclick="downloadReport()">Download</button>
</div>

</div>

<script>

/* REPORT */
let analysisReport = {
    dna: [], gc: [], motif: [],
    localization: [], blast: [],
    uniprot: [], multi: []
};

/* NAV */
function show(id){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* BASIC TRANSLATE */
async function runTranslate(){
    const dna = document.getElementById("dnaSeq").value;

    const r = await fetch("/translate",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"dna="+dna
    });

    const result = await r.text();
    document.getElementById("r1").innerText = result;
    analysisReport.dna.push(result);
}

/* 🚀 6-FRAME + ORF */
async function runAdvanced(){

    const dna = document.getElementById("dnaSeq").value;

    const r = await fetch("/translate-advanced",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"dna="+dna
    });

    const data = await r.json();

    // ✅ HANDLE ERROR (prevents crash)
    if(data.error){
        document.getElementById("r1").innerText = "❌ " + data.error;
        return;
    }

    // ✅ SAFE STRUCTURE
    const frames = data.frames || {};
    const orfs = data.orfs || [];
    const best = data.bestORF || null;

    let output = "🧬 6-FRAME TRANSLATION\n\n";

    // ✅ DISPLAY FRAMES CORRECTLY
    Object.keys(frames).forEach(frame=>{
        output += `=== ${frame} ===\n${frames[frame]}\n\n`;
    });

    // ✅ ORFs
    output += "\n🧪 ORFs DETECTED:\n";

    if(orfs.length === 0){
        output += "No ORFs found\n";
    } else {
        orfs.forEach((o,i)=>{
            output += `ORF ${i+1} | Frame: ${o.frame} | Start: ${o.start} | End: ${o.end} | Length: ${o.length}\n`;
        });
    }

    // ✅ BEST ORF
    if(best){
        output += `\n🏆 LONGEST ORF:\nFrame ${best.frame} | ${best.start}-${best.end} (${best.length} bp)\n`;
    }

    document.getElementById("r1").innerText = output;
    analysisReport.dna.push(output);
}
/* MOTIF */
async function motifRun(){
    const seq=document.getElementById("motifSeq").value;
    const m=document.getElementById("motifText").value;

    const r=await fetch("/motif",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`sequence=${seq}&motif=${m}`
    });

    const result = await r.text();
    document.getElementById("r3").innerText=result;
    analysisReport.motif.push(result);
}

/* LOCALIZATION */
async function runLocalization(){

    const seq = document.getElementById("protSeq").value;

    const r = await fetch("/localization",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:`protein=${seq}`
    });

    const data = await r.json();

    const display = `
📍 Location: ${data.location}
🎯 Confidence: ${data.confidence}
🔗 ${data.link}
`;

    document.getElementById("r4").innerText = display;
    analysisReport.localization.push(display);
}

/* BLAST */
async function blastRun(){
    const f=document.getElementById("blastFile").files[0];
    const fd=new FormData();
    fd.append("file",f);

    const r=await fetch("/upload-blast",{method:"POST",body:fd});
    const result = await r.text();

    document.getElementById("blastOut").innerText=result;
    analysisReport.blast.push(result);
}

/* UNIPROT */
async function uniprotRun(){

    const id = document.getElementById("upid").value;

    const r = await fetch("/uniprot",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"id="+id
    });

    const data = await r.json();

    const display = `
🧬 ${data.protein}
🌍 ${data.organism}
🧬 ${data.gene}
📏 ${data.length}

${data.functionText}
`;

    document.getElementById("uniOut").innerText = display;
    analysisReport.uniprot.push(display);
}

/* MULTI */
async function runMulti(){

    const file=document.getElementById("multiFile").files[0];
    const fd=new FormData();
    fd.append("file",file);

    const r=await fetch("/upload-multi",{method:"POST",body:fd});
    const data=await r.json();

    document.getElementById("multiOut").innerText=data.report;
    analysisReport.multi.push(data.report);
}

/* REPORT */
function downloadReport(){

    let report = "BIOINFORMATICS REPORT\n\n";

    Object.keys(analysisReport).forEach(k=>{
        report += `\n=== ${k.toUpperCase()} ===\n`;
        report += analysisReport[k].join("\n\n");
    });

    const blob=new Blob([report],{type:"text/plain"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="report.txt";
    a.click();
}

</script>

</body>
</html>
